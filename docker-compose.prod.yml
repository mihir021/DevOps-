services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/mihir021/devops--server:latest}
    container_name: mern-server
    restart: unless-stopped
    env_file:
      - .env
    # Port 5000 is NOT exposed publicly — the Nginx container (client)
    # reverse-proxies /api/* to server:5000 internally over the Docker
    # network. This is more secure than opening port 5000 to the internet.
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  client:
    image: ${CLIENT_IMAGE:-ghcr.io/mihir021/devops--client:latest}
    container_name: mern-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: mern-prometheus
    profiles:
      - monitoring
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      server:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: mern-grafana
    profiles:
      - monitoring
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

