server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Reverse Proxy ----
    # Forward API requests to the backend server container.
    # "server" is the docker-compose service name — Docker's internal DNS
    # resolves it to the server container's IP on the shared network.
    # This way the browser only talks to port 80 (Nginx), and we never
    # need to expose port 5000 publicly or hardcode any IP addresses.
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward health check requests to the backend (used by monitoring tools).
    location /health {
        proxy_pass http://server:5000/health;
    }

    # Forward Prometheus metrics endpoint to the backend.
    location /metrics {
        proxy_pass http://server:5000/metrics;
    }

    # ---- Static Files + React Router ----
    # React Router uses client-side routing (BrowserRouter). Without this,
    # refreshing a URL like /dashboard would ask Nginx for a file that
    # doesn't exist on disk and return a 404. This tells Nginx: if the file
    # isn't found, fall back to index.html and let React Router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
