name: CD

# Only runs on pushes to main, and only after CI's checks would apply to
# that same commit (in a stricter setup we'd make this depend on the CI
# workflow's result via workflow_run - kept simple here on purpose).
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image tags
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "SERVER_IMAGE=ghcr.io/${REPO_LC}-server" >> $GITHUB_ENV
          echo "CLIENT_IMAGE=ghcr.io/${REPO_LC}-client" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          # No VITE_API_URL build-arg needed — the frontend uses a relative
          # "/api" path, and Nginx reverse-proxies it to the server container.
          # This means the client image works with ANY server IP/domain.
          tags: |
            ${{ env.CLIENT_IMAGE }}:latest
            ${{ env.CLIENT_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Check if EC2 secrets are configured
        id: check_secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "::notice::EC2_HOST secret is not configured. Skipping deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set lowercase image tags
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "SERVER_IMAGE=ghcr.io/${REPO_LC}-server" >> $GITHUB_ENV
          echo "CLIENT_IMAGE=ghcr.io/${REPO_LC}-client" >> $GITHUB_ENV

      - name: Create deployment directory
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p apps/${{ github.event.repository.name }}

      - name: Copy compose file + monitoring config to the server
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'docker-compose.prod.yml,monitoring'
          target: 'apps/${{ github.event.repository.name }}'

      - name: Write .env and redeploy over SSH
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MONGODB_URI,JWT_SECRET,GRAFANA_ADMIN_PASSWORD,SERVER_IMAGE,CLIENT_IMAGE,SERVER_PORT,CLIENT_PORT,PROMETHEUS_PORT,GRAFANA_PORT
          script: |
            set -e
            DEPLOY_DIR="apps/${{ github.event.repository.name }}"
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            
            cat > .env <<EOF
            MONGODB_URI=$MONGODB_URI
            JWT_SECRET=$JWT_SECRET
            SERVER_IMAGE=$SERVER_IMAGE
            CLIENT_IMAGE=$CLIENT_IMAGE
            GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD
            SERVER_PORT=${SERVER_PORT:-5000}
            CLIENT_PORT=${CLIENT_PORT:-8080}
            PROMETHEUS_PORT=${PROMETHEUS_PORT:-9090}
            GRAFANA_PORT=${GRAFANA_PORT:-3000}
            EOF
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          SERVER_IMAGE: ${{ env.SERVER_IMAGE }}
          CLIENT_IMAGE: ${{ env.CLIENT_IMAGE }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          CLIENT_PORT: ${{ secrets.CLIENT_PORT }}
          PROMETHEUS_PORT: ${{ secrets.PROMETHEUS_PORT }}
          GRAFANA_PORT: ${{ secrets.GRAFANA_PORT }}
