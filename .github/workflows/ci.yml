name: CI

# Runs on every push to any branch, and on every PR targeting main.
# The merge-check job below additionally filters itself to skip main.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  # ---- 3.1 + 3.2: server job - install, lint, test ----
  server:
    name: Server - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # ---- 3.3: client job - install, lint, test, build ----
  client:
    name: Client - Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---- 3.4: build (but don't push) both Docker images ----
  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: devops-mern-server:ci

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          tags: devops-mern-client:ci

  # ---- Dummy-merge conflict check ----
  # If you push to any branch other than main, this tries merging main into
  # your branch (in a throwaway checkout - nothing is ever pushed or
  # committed for real) purely to detect merge conflicts early, before you
  # even open a PR.
  merge-check:
    name: Check for merge conflicts with main
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure a throwaway git identity
        run: |
          git config user.name "ci-merge-check"
          git config user.email "ci-merge-check@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main

      - name: Attempt a dummy merge with main
        id: merge_attempt
        continue-on-error: true
        run: git merge --no-commit --no-ff origin/main

      - name: Report result
        run: |
          if [ "${{ steps.merge_attempt.outcome }}" = "failure" ]; then
            echo "## Merge conflict detected with main" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Merging this branch into \`main\` right now would conflict in:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U | sed 's/^/- `/;s/$/`/' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::This branch has merge conflicts with main. Resolve them before merging."
            git merge --abort
            exit 1
          fi

          echo "## No merge conflicts with main" >> "$GITHUB_STEP_SUMMARY"
          git merge --abort || true
