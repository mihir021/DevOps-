apiVersion: 1

# Tells Grafana to auto-load any dashboard JSON files placed in this folder,
# instead of requiring you to import them by hand through the UI.
providers:
  - name: 'DevOps MERN Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
